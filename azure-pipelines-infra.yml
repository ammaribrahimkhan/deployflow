# DeployFlow infrastructure checks (Milestone 3)
# Checks Terraform formatting and validity without external extensions.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml

pool:
  name: deployflow-laptop-pool

steps:
  - checkout: self
    clean: true

  # Native Fix: Explicitly updates the PATH variable to include your local laptop's winget link location
  - powershell: |
      $wingetPath = "$env:LOCALAPPDATA\Microsoft\WinGet\Links"
      if (Test-Path $wingetPath) {
          Write-Host "Adding WinGet links directory to environment PATH: $wingetPath"
          echo "##vso[task.prependpath]$wingetPath"
      } else {
          Write-Host "Standard WinGet path not found. Checking system paths..."
      }
    displayName: Map Local Terraform Path

  - powershell: |
      terraform version
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]terraform not found on your laptop agent."
        exit 1
      }
    displayName: Terraform version

  - powershell: |
      terraform fmt -check -recursive -diff
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Formatting problems found. Run: terraform fmt -recursive"
        exit 1
      }
    workingDirectory: infra
    displayName: Terraform format check

  - powershell: |
      $stacks = @("shared", "envs/dev")
      foreach ($stack in $stacks) {
        Write-Host "=== Validating $stack ==="
        Push-Location $stack
        terraform init -backend=false -input=false
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform init failed in $stack"
          exit 1
        }
        terraform validate
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform validate failed in $stack"
          exit 1
        }
        Pop-Location
      }
    workingDirectory: infra
    displayName: Terraform validate
