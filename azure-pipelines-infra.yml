# DeployFlow infrastructure checks (Milestone 4)
#
# Checks Terraform formatting, security misconfigurations and validity.
# Needs NO Azure credentials: "init -backend=false" never touches the remote state.
# Plan/apply with approvals is added in Milestone 5.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml
      - pipelines/*
      - scripts/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml
      - pipelines/*
      - scripts/*

pool:
  name: deployflow-laptop-pool

variables:
  - template: pipelines/variables.yml

steps:
  - checkout: self
    clean: true

  # Native fallback: Automatically locate your working local installation path and map it dynamically
  - powershell: |
      Write-Host "Checking local environmental paths for terraform binary..."
      $wingetPath = "C:\Users\Hp\AppData\Local\Microsoft\WinGet\Packages\Hashicorp.Terraform_Microsoft.Winget.Source_8wekyb3d8bbwe"
      
      if (Test-Path "$wingetPath\terraform.exe") {
          Write-Host "Found local winget terraform version! Injecting binary path to pipeline runtime context..."
          Write-Host "##vso[task.prependpath]$wingetPath"
      } else {
          Write-Host "##vso[task.logissue type=warning]Could not map local package path manually. Attempting default system path execution..."
      }
    displayName: Map Local Binary Environment Paths

  - powershell: |
      terraform version
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]terraform command was still not recognized in the pipeline runtime."
        exit 1
      }
    displayName: Terraform version

  - powershell: |
      terraform fmt -check -recursive -diff
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Formatting problems found. Run: terraform fmt -recursive"
        exit 1
      }
    workingDirectory: infra
    displayName: Terraform format check

  - powershell: |
      Write-Host "=== Informational: HIGH and CRITICAL findings (do not block) ==="
      & .\scripts\run-trivy.ps1 -TrivyImage "$(trivyImage)" -SourceDir "$(Build.SourcesDirectory)" -TrivyArgs @("config", "--severity", "HIGH,CRITICAL", "--exit-code", "0", "infra")
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Trivy could not scan the Terraform code (see the log above)"
        exit 1
      }

      Write-Host "=== Gate: CRITICAL findings block ==="
      & .\scripts\run-trivy.ps1 -TrivyImage "$(trivyImage)" -SourceDir "$(Build.SourcesDirectory)" -TrivyArgs @("config", "--severity", "CRITICAL", "--exit-code", "1", "infra")
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]CRITICAL infrastructure misconfiguration found"
        exit 1
      }
    displayName: Scan Terraform for misconfigurations (Trivy)

  - powershell: |
      $stacks = @("shared", "envs/dev")
      foreach ($stack in $stacks) {
        Write-Host "=== Validating $stack ==="
        Push-Location $stack
        terraform init -backend=false -input=false
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform init failed in $stack"
          exit 1
        }
        terraform validate
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform validate failed in $stack"
          exit 1
        }
        Pop-Location
      }
    workingDirectory: infra
    displayName: Terraform validate
