# DeployFlow infrastructure checks (Milestone 3)
# Checks Terraform formatting and validity with targeted local path mapping.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - azure-pipelines-infra.yml

pool:
  name: deployflow-laptop-pool

steps:
  - checkout: self
    clean: true

  # Robust Fix: Map your exact WinGet local package directory onto the active runner thread context
  - powershell: |
      $targetPath = "C:\Users\Hp\AppData\Local\Microsoft\WinGet\Packages\Hashicorp.Terraform_Microsoft.Winget.Source_8wekyb3d8bbwe"
      if (Test-Path $targetPath) {
          Write-Host "Found your local WinGet Terraform package folder! Prepending to pipeline PATH: $targetPath"
          echo "##vso[task.prependpath]$targetPath"
      } else {
          Write-Host "##vso[task.logissue type=warning]Specified package folder path could not be located by the runner service context."
      }
    displayName: Map Local Terraform Path

  - powershell: |
      terraform version
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]terraform command still not reachable on the agent."
        exit 1
      }
    displayName: Terraform version

  - powershell: |
      terraform fmt -check -recursive -diff
      if ($LASTEXITCODE -ne 0) {
        Write-Host "##vso[task.logissue type=error]Formatting problems found. Run: terraform fmt -recursive"
        exit 1
      }
    workingDirectory: infra
    displayName: Terraform format check

  - powershell: |
      $stacks = @("shared", "envs/dev")
      foreach ($stack in $stacks) {
        Write-Host "=== Validating $stack ==="
        Push-Location $stack
        terraform init -backend=false -input=false
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform init failed in $stack"
          exit 1
        }
        terraform validate
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]terraform validate failed in $stack"
          exit 1
        }
        Pop-Location
      }
    workingDirectory: infra
    displayName: Terraform validate
