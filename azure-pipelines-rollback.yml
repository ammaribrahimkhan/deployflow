
# DeployFlow rollback pipeline (Milestone 7)
#
# Manual only. Sends 100% of the production traffic back to an earlier revision.
# Runs against the "production" environment, so it needs the same approval and branch check
# as a release. Safe to run more than once (idempotent). Every rollback is also recorded as an
# event in Application Insights (best effort).
#
# Parameters:
#   targetRevision : leave empty to go back to the previous revision
#   reason         : short text stored in the rollback record

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: targetRevision
    displayName: Revision to roll back to (empty = the previous revision)
    type: string
    default: ''
  - name: reason
    displayName: Reason for the rollback (no quote characters)
    type: string
    default: manual rollback

pool:
  name: deployflow-laptop-pool

variables:
  - name: azureServiceConnection
    value: sc-azure-deployflow
  - name: prodApp
    value: ca-deployflow-prod
  - name: prodResourceGroup
    value: rg-deployflow-prod-eus2
  - name: prodAppInsights
    value: appi-deployflow-prod-eus2

stages:
  - stage: Rollback
    displayName: Roll back production
    jobs:
      - deployment: RollbackProduction
        displayName: Roll back production
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: AzureCLI@2
                  displayName: Restore the previous revision
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\rollback-containerapp.ps1
                    arguments: >
                      -AppName "$(prodApp)"
                      -ResourceGroup "$(prodResourceGroup)"
                      -OutputPath "$(Build.ArtifactStagingDirectory)\rollback\rollback-record.json"
                      -TargetRevision "${{ parameters.targetRevision }}"
                      -Reason "${{ parameters.reason }}"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - powershell: |
                    # Smoke test production after the rollback.
                    & "$(Build.SourcesDirectory)\scripts\smoke-test.ps1" -BaseUrl "$(appUrl)" -ExpectedSha "" -ExpectedEnvironment "prod" -MaxP95Ms 5000 -OutputPath "$(Build.ArtifactStagingDirectory)\rollback\smoke-after-rollback.json"
                    if ($LASTEXITCODE -ne 0) { exit 1 }
                  workingDirectory: $(Build.SourcesDirectory)
                  displayName: Smoke test production after the rollback

                - task: AzureCLI@2
                  displayName: Record the rollback event in Application Insights
                  condition: always()
                  continueOnError: true
                  retryCountOnTaskFailure: 3
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\send-deployment-event.ps1
                    arguments: >
                      -AppInsightsName "$(prodAppInsights)"
                      -ResourceGroup "$(prodResourceGroup)"
                      -RecordPath "$(Build.ArtifactStagingDirectory)\rollback\rollback-record.json"
                      -EnvironmentName production
                      -EventName Rollback
                      -JobStatus "$(Agent.JobStatus)"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - publish: $(Build.ArtifactStagingDirectory)/rollback
                  artifact: rollback-record
                  condition: always()
                  displayName: Publish the rollback record
