# DeployFlow CI pipeline (Milestone 2)
#
# Runs on the self-hosted laptop agent (Windows, PowerShell).
# - Pull requests: lint + unit tests only. Nothing is pushed anywhere.
# - Pushes to main: lint + tests, then build, smoke test and push the image to ACR.
#
# No secrets are used. Azure login goes through the workload identity
# federation service connection, which uses short-lived tokens.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - azure-pipelines.yml

pool:
  name: deployflow-laptop-pool

variables:
  acrName: acrdeployflowammar03
  acrLoginServer: acrdeployflowammar03.azurecr.io
  imageName: deployflow-app
  azureServiceConnection: sc-azure-deployflow
  appVersion: 1.0.$(Build.BuildId)

stages:
  # ---------------------------------------------------------------------------
  # Stage 1: quality gate. If anything here fails, nothing gets built.
  # ---------------------------------------------------------------------------
  - stage: Test
    displayName: Lint and unit tests
    jobs:
      - job: Test
        displayName: Lint and unit tests
        steps:
          - checkout: self
            clean: true

          - powershell: |
              python --version
              if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]python not found on the agent"; exit 1 }
              python -m venv .venv
              if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]venv creation failed"; exit 1 }
              .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
              if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]pip install failed"; exit 1 }
            workingDirectory: app
            displayName: Install dependencies

          - powershell: |
              .\.venv\Scripts\python.exe -m ruff check .
              if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]Lint check failed"; exit 1 }
            workingDirectory: app
            displayName: Code quality (ruff)

          - powershell: |
              .\.venv\Scripts\python.exe -m pytest --junitxml=test-results.xml
              if ($LASTEXITCODE -ne 0) { Write-Host "##vso[task.logissue type=error]Unit tests failed"; exit 1 }
            workingDirectory: app
            displayName: Unit tests (pytest)

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: app/test-results.xml
              testRunTitle: DeployFlow unit tests

  # ---------------------------------------------------------------------------
  # Stage 2: build, verify and publish the image. Never runs for pull requests.
  # ---------------------------------------------------------------------------
  - stage: BuildPush
    displayName: Build, verify and publish image
    dependsOn: Test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildPush
        displayName: Build, smoke test, push
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Build image, smoke test it, push to ACR
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: ps
              scriptLocation: inlineScript
              failOnStandardError: false
              workingDirectory: $(Build.SourcesDirectory)\app
              inlineScript: |
                function Fail($message) {
                  Write-Host "##vso[task.logissue type=error]$message"
                  exit 1
                }

                $sha = "$(Build.SourceVersion)".Substring(0, 7)
                $image = "$(acrLoginServer)/$(imageName)"
                $tag = "${image}:$sha"
                $container = "df-smoke-$(Build.BuildId)"
                $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

                # 1. Build. The commit SHA and build info are stored as image labels.
                Write-Host "Building $tag"
                docker build `
                  --build-arg APP_VERSION=$(appVersion) `
                  --build-arg GIT_SHA=$sha `
                  --label "org.opencontainers.image.revision=$(Build.SourceVersion)" `
                  --label "org.opencontainers.image.source=$(Build.Repository.Uri)" `
                  --label "org.opencontainers.image.version=$(appVersion)" `
                  --label "deployflow.build.id=$(Build.BuildId)" `
                  --label "deployflow.build.number=$(Build.BuildNumber)" `
                  --tag $tag `
                  .
                if ($LASTEXITCODE -ne 0) { Fail "docker build failed" }

                # 2. Smoke test: run the image we just built and check it is healthy.
                docker run -d --name $container -p 18080:3000 -e APP_ENV=ci-smoke $tag | Out-Null
                if ($LASTEXITCODE -ne 0) { Fail "docker run failed (is port 18080 already in use?)" }

                $failure = $null
                $healthy = $false
                for ($i = 1; $i -le 30; $i++) {
                  try {
                    $r = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
                    if ($r.status -eq "healthy") { $healthy = $true; break }
                  } catch {
                    Start-Sleep -Seconds 1
                  }
                }

                if (-not $healthy) {
                  $failure = "Smoke test failed: /health never reported healthy"
                  docker logs $container
                } else {
                  $info = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/info" -TimeoutSec 5
                  if ($info.gitSha -ne $sha) {
                    $failure = "Smoke test failed: image reports commit {0} but expected {1}" -f $info.gitSha, $sha
                  } else {
                    Write-Host "Smoke test passed: image reports commit $($info.gitSha)"
                  }
                }

                docker rm -f $container | Out-Null
                if ($failure) { Fail $failure }

                # 3. Push to ACR using the pipeline's federated identity.
                az acr login --name $(acrName)
                if ($LASTEXITCODE -ne 0) { Fail "az acr login failed" }

                docker push $tag
                if ($LASTEXITCODE -ne 0) { Fail "docker push failed" }

                $digest = az acr repository show --name $(acrName) --image "$(imageName):$sha" --query digest -o tsv
                if ($LASTEXITCODE -ne 0 -or -not $digest) { Fail "Could not read the image digest from ACR" }
                Write-Host "Pushed $tag"
                Write-Host "Digest: $digest"

                # 4. Save release metadata: ties commit, build and image together.
                $meta = [ordered]@{
                  application    = "deployflow-app"
                  gitSha         = "$(Build.SourceVersion)"
                  shortSha       = $sha
                  branch         = "$(Build.SourceBranchName)"
                  buildId        = [int]"$(Build.BuildId)"
                  buildNumber    = "$(Build.BuildNumber)"
                  appVersion     = "$(appVersion)"
                  imageRepository = $image
                  imageTag       = $sha
                  imageDigest    = $digest
                  imageReference = ("{0}@{1}" -f $image, $digest)
                  builtAtUtc     = $builtAt
                  pipelineRunUrl = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                }
                $json = $meta | ConvertTo-Json
                $path = Join-Path "$(Build.ArtifactStagingDirectory)" "release-metadata.json"
                [System.IO.File]::WriteAllText($path, $json, (New-Object System.Text.UTF8Encoding $false))
                Write-Host $json

                docker logout $(acrLoginServer) | Out-Null

          - publish: $(Build.ArtifactStagingDirectory)/release-metadata.json
            artifact: release-metadata
            displayName: Publish release metadata