
# DeployFlow CI Pipeline - Milestone 4
# Security gates, Docker build, smoke test, image scan, SBOM and ACR push.
#
# Pull requests:
#   Security scans, lint, static analysis and unit tests.
#   No Docker release build and no ACR push.
#
# Main branch and manual runs:
#   All checks, Docker build, smoke test, image vulnerability scan,
#   SBOM generation and finally ACR push.
#
# Azure credentials are used only in the ACR publishing step.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - azure-pipelines.yml
      - pipelines/*
      - scripts/*
      - .trivyignore

pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - azure-pipelines.yml
      - pipelines/*
      - scripts/*
      - .trivyignore

pool:
  name: deployflow-laptop-pool

variables:
  - template: pipelines/variables.yml

  - name: acrName
    value: acrdeployflowsharedammar03

  - name: acrLoginServer
    value: acrdeployflowsharedammar03.azurecr.io

  - name: imageName
    value: deployflow-app

  - name: azureServiceConnection
    value: sc-azure-deployflow

  - name: appVersion
    value: 1.0.$(Build.BuildId)

stages:

# ============================================================
# STAGE 1: QUALITY AND SECURITY
# ============================================================

- stage: Test
  displayName: Security scans, lint and unit tests

  jobs:
    - job: Test
      displayName: Security scans, lint and unit tests

      steps:
        - checkout: self
          clean: true

        # ----------------------------------------------------
        # 1. Trivy source scan
        # ----------------------------------------------------

        - powershell: |
            & .\scripts\run-trivy.ps1 `
              -TrivyImage "$(trivyImage)" `
              -SourceDir "$(Build.SourcesDirectory)" `
              -TrivyArgs @(
                "fs",
                "--timeout", "20m",
                "--scanners", "vuln,secret",
                "--severity", "HIGH,CRITICAL",
                "--ignore-unfixed",
                "--exit-code", "1",
                "--skip-dirs", "**/.venv",
                "--skip-dirs", "**/.terraform",
                "--skip-dirs", ".git",
                "."
              )

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Trivy source scan failed."
              exit 1
            }
          displayName: Scan source for secrets and vulnerabilities (Trivy)
          timeoutInMinutes: 30

        # ----------------------------------------------------
        # 2. Install Python dependencies
        # ----------------------------------------------------

        - powershell: |
            py --version

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Python launcher not found."
              exit 1
            }

            py -m venv .venv

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Virtual environment creation failed."
              exit 1
            }

            .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Dependency installation failed."
              exit 1
            }
          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Install Python dependencies

        # ----------------------------------------------------
        # 3. Ruff lint
        # ----------------------------------------------------

        - powershell: |
            .\.venv\Scripts\python.exe -m ruff check .

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Ruff lint check failed."
              exit 1
            }
          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Code quality (Ruff)

        # ----------------------------------------------------
        # 4. Bandit security analysis
        # ----------------------------------------------------

        - powershell: |
            .\.venv\Scripts\python.exe -m bandit -r main.py -ll

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Bandit security analysis failed."
              exit 1
            }
          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Static security analysis (Bandit)

        # ----------------------------------------------------
        # 5. Python dependency vulnerability audit
        # ----------------------------------------------------

        - powershell: |
            .\.venv\Scripts\python.exe -m pip_audit -r requirements.txt --progress-spinner off

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]pip-audit found vulnerable dependencies."
              exit 1
            }
          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Python dependency audit (pip-audit)

        # ----------------------------------------------------
        # 6. Unit tests
        # ----------------------------------------------------

        - powershell: |
            .\.venv\Scripts\python.exe -m pytest --junitxml=test-results.xml

            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Unit tests failed."
              exit 1
            }
          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Unit tests (pytest)

        # ----------------------------------------------------
        # 7. Publish test results
        # ----------------------------------------------------

        - task: PublishTestResults@2
          displayName: Publish test results
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: 'app/test-results.xml'
            testRunTitle: DeployFlow unit tests


# ============================================================
# STAGE 2: BUILD, SMOKE TEST, SECURITY SCAN AND PUSH
# ============================================================

- stage: BuildPush
  displayName: Build, scan and publish image
  dependsOn: Test
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  jobs:
    - job: BuildPush
      displayName: Build, scan and push

      steps:
        - checkout: self
          clean: true

        # ----------------------------------------------------
        # STEP A: Docker build and smoke test
        # No Azure credentials are used here.
        # ----------------------------------------------------

        - powershell: |
            function Fail($message) {
              Write-Host "##vso[task.logissue type=error]$message"
              exit 1
            }

            $sha = "$(Build.SourceVersion)".Substring(0, 7)
            $image = "$(acrLoginServer)/$(imageName)"
            $tag = "${image}:$sha"
            $container = "df-smoke-$(Build.BuildId)"

            Write-Host "Building Docker image: $tag"

            $buildArgs = @(
              "build",
              "--build-arg", "APP_VERSION=$(appVersion)",
              "--build-arg", "GIT_SHA=$sha",
              "--label", "org.opencontainers.image.revision=$(Build.SourceVersion)",
              "--label", "org.opencontainers.image.source=$(Build.Repository.Uri)",
              "--label", "org.opencontainers.image.version=$(appVersion)",
              "--label", "deployflow.build.id=$(Build.BuildId)",
              "--label", "deployflow.build.number=$(Build.BuildNumber)",
              "--tag", $tag,
              "."
            )

            & docker @buildArgs

            if ($LASTEXITCODE -ne 0) {
              Fail "Docker build failed."
            }

            Write-Host "Starting smoke-test container."

            docker run -d --name $container -p 18080:3000 -e APP_ENV=ci-smoke $tag | Out-Null

            if ($LASTEXITCODE -ne 0) {
              Fail "Docker container failed to start."
            }

            $failure = $null
            $healthy = $false

            for ($i = 1; $i -le 30; $i++) {
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2

                if ($r.status -eq "healthy") {
                  $healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $healthy) {
              $failure = "Smoke test failed: /health never reported healthy."
              docker logs $container
            }
            else {
              try {
                $info = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/info" -TimeoutSec 5

                $reportedSha = $info.gitSha

                if ($reportedSha -ne $sha) {
                  $failure = "Smoke test failed: expected $sha but received $reportedSha."
                }
                else {
                  Write-Host "Smoke test passed."
                  Write-Host "Application commit: $reportedSha"
                }
              }
              catch {
                $failure = "Smoke test failed: /api/info endpoint was unavailable."
              }
            }

            docker rm -f $container | Out-Null

            if ($failure) {
              Fail $failure
            }

            Write-Host "##vso[task.setvariable variable=imageSha]$sha"
            Write-Host "##vso[task.setvariable variable=imageTag]$tag"

            Write-Host "Docker build and smoke test completed successfully."

          workingDirectory: $(Build.SourcesDirectory)\app
          displayName: Build Docker image and smoke test

        # ----------------------------------------------------
        # STEP B: Trivy image scan and SBOM generation
        # No Azure credentials are used here.
        # ----------------------------------------------------

        - powershell: |
            function Fail($message) {
              Write-Host "##vso[task.logissue type=error]$message"
              exit 1
            }

            function Write-Utf8($path, $content) {
              [System.IO.File]::WriteAllText(
                $path,
                $content,
                (New-Object System.Text.UTF8Encoding $false)
              )
            }

            $src = "$(Build.SourcesDirectory)"
            $reports = "$(Build.ArtifactStagingDirectory)\reports"
            $tarDir = "$(Agent.TempDirectory)"
            $tar = Join-Path $tarDir "image.tar"
            $trivy = "$(trivyImage)"

            New-Item -ItemType Directory -Force -Path $reports | Out-Null

            Write-Host "##vso[task.setvariable variable=reportsReady]true"

            docker save -o $tar "$(imageTag)"

            if ($LASTEXITCODE -ne 0) {
              Fail "Docker image export failed."
            }

            $versionText = (
              & .\scripts\run-trivy.ps1 `
                -TrivyImage $trivy `
                -SourceDir $src `
                -TrivyArgs @("--version") | Out-String
            )

            $trivyVersion = "unknown"

            if ($versionText -match "Version:\s*(\S+)") {
              $trivyVersion = $Matches[1]
            }

            Write-Host "Trivy version: $trivyVersion"

            # 1. Generate complete JSON vulnerability report.

            & .\scripts\run-trivy.ps1 `
              -TrivyImage $trivy `
              -SourceDir $src `
              -InputDir $tarDir `
              -OutDir $reports `
              -TrivyArgs @(
                "image",
                "--input", "/in/image.tar",
                "--severity", "HIGH,CRITICAL",
                "--ignore-unfixed",
                "--format", "json",
                "--output", "/out/trivy-image-report.json"
              )

            if ($LASTEXITCODE -ne 0) {
              Fail "Trivy could not generate the image vulnerability report."
            }

            # 2. Generate CycloneDX SBOM.

            & .\scripts\run-trivy.ps1 `
              -TrivyImage $trivy `
              -SourceDir $src `
              -InputDir $tarDir `
              -OutDir $reports `
              -TrivyArgs @(
                "image",
                "--input", "/in/image.tar",
                "--format", "cyclonedx",
                "--output", "/out/sbom.cdx.json"
              )

            if ($LASTEXITCODE -ne 0) {
              Fail "SBOM generation failed."
            }

            # 3. Enforce HIGH and CRITICAL vulnerability gate.

            & .\scripts\run-trivy.ps1 `
              -TrivyImage $trivy `
              -SourceDir $src `
              -InputDir $tarDir `
              -TrivyArgs @(
                "image",
                "--input", "/in/image.tar",
                "--severity", "HIGH,CRITICAL",
                "--ignore-unfixed",
                "--exit-code", "1"
              )

            $gateExit = $LASTEXITCODE

            $gateResult = "failed"

            if ($gateExit -eq 0) {
              $gateResult = "passed"
            }

            # 4. Read vulnerability counts from JSON report.

            $report = Get-Content (Join-Path $reports "trivy-image-report.json") -Raw | ConvertFrom-Json

            $vulns = @()

            foreach ($result in $report.Results) {
              if ($result.Vulnerabilities) {
                $vulns += $result.Vulnerabilities
              }
            }

            $critical = @($vulns | Where-Object { $_.Severity -eq "CRITICAL" }).Count
            $high = @($vulns | Where-Object { $_.Severity -eq "HIGH" }).Count

            # 5. Calculate SBOM integrity hash.

            $sbomPath = Join-Path $reports "sbom.cdx.json"

            $sbomHash = (
              Get-FileHash -Path $sbomPath -Algorithm SHA256
            ).Hash.ToLower()

            $scannedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

            # 6. Generate security summary.

            $summary = [ordered]@{
              tool              = "trivy"
              toolVersion       = $trivyVersion
              toolImage         = $trivy
              scannedImage      = "$(imageTag)"
              severityThreshold = "HIGH,CRITICAL"
              ignoreUnfixed     = $true
              criticalCount     = $critical
              highCount         = $high
              gateResult        = $gateResult
              sbomFormat        = "CycloneDX"
              sbomFile          = "sbom.cdx.json"
              sbomSha256        = $sbomHash
              scannedAtUtc      = $scannedAt
            }

            Write-Utf8 `
              (Join-Path $reports "security-summary.json") `
              ($summary | ConvertTo-Json -Depth 5)

            Remove-Item $tar -Force -ErrorAction SilentlyContinue

            if ($gateExit -ne 0) {
              Fail "Image scan failed: $critical CRITICAL and $high HIGH vulnerabilities. Image NOT pushed."
            }

            Write-Host "Image vulnerability scan passed."
            Write-Host "SBOM generated: $sbomPath"

          workingDirectory: $(Build.SourcesDirectory)
          displayName: Scan image with Trivy and generate SBOM

        # ----------------------------------------------------
        # STEP C: ACR PUSH
        # The only step using Azure credentials.
        # ----------------------------------------------------

        - task: AzureCLI@2
          displayName: Push scanned image to ACR and write release metadata

          inputs:
            azureSubscription: $(azureServiceConnection)
            scriptType: ps
            scriptLocation: inlineScript
            failOnStandardError: false
            workingDirectory: $(Build.SourcesDirectory)

            inlineScript: |
              function Fail($message) {
                Write-Host "##vso[task.logissue type=error]$message"
                exit 1
              }

              $sha = "$(imageSha)"
              $tag = "$(imageTag)"
              $image = "$(acrLoginServer)/$(imageName)"
              $reports = "$(Build.ArtifactStagingDirectory)\reports"

              $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

              # Authenticate to ACR using the Azure service connection.

              az acr login --name $(acrName)

              if ($LASTEXITCODE -ne 0) {
                Fail "Azure Container Registry login failed."
              }

              # Push only the previously scanned image.

              docker push $tag

              if ($LASTEXITCODE -ne 0) {
                Fail "Docker image push failed."
              }

              # Retrieve immutable registry digest.

              $digest = az acr repository show `
                --name $(acrName) `
                --image "$(imageName):$sha" `
                --query digest -o tsv

              if ($LASTEXITCODE -ne 0 -or -not $digest) {
                Fail "Could not retrieve the image digest from ACR."
              }

              Write-Host "Pushed image: $tag"
              Write-Host "Image digest: $digest"

              # Read security evidence.

              $security = Get-Content `
                (Join-Path $reports "security-summary.json") `
                -Raw | ConvertFrom-Json

              # Create release metadata.

              $meta = [ordered]@{
                application     = "deployflow-app"
                gitSha          = "$(Build.SourceVersion)"
                shortSha        = $sha
                repository      = "$(Build.Repository.Name)"
                branch          = "$(Build.SourceBranchName)"
                trigger         = "$(Build.Reason)"
                buildId         = [int]"$(Build.BuildId)"
                buildNumber     = "$(Build.BuildNumber)"
                agentName       = "$(Agent.Name)"
                appVersion      = "$(appVersion)"
                imageRepository = $image
                imageTag        = $sha
                imageDigest     = $digest
                imageReference  = ("{0}@{1}" -f $image, $digest)
                builtAtUtc      = $builtAt
                pipelineRunUrl  = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                security        = $security
              }

              $json = $meta | ConvertTo-Json -Depth 6

              $path = Join-Path $reports "release-metadata.json"

              [System.IO.File]::WriteAllText(
                $path,
                $json,
                (New-Object System.Text.UTF8Encoding $false)
              )

              Write-Host "Release metadata generated."
              Write-Host $json

        # ----------------------------------------------------
        # STEP D: Publish security and release evidence.
        # ----------------------------------------------------

        - publish: $(Build.ArtifactStagingDirectory)/reports
          artifact: release-evidence
          condition: and(always(), eq(variables['reportsReady'], 'true'))
          displayName: Publish release evidence (SBOM, reports, metadata)

        # ----------------------------------------------------
        # STEP E: Cleanup.
        # ----------------------------------------------------

        - powershell: |
            $tar = Join-Path "$(Agent.TempDirectory)" "image.tar"

            if (Test-Path $tar) {
              Remove-Item $tar -Force
            }

            docker rm -f "df-smoke-$(Build.BuildId)" 2>&1 | Out-Null

            docker logout "$(acrLoginServer)" 2>&1 | Out-Null

            exit 0

          condition: always()
          displayName: Cleanup temporary files, containers and registry login
