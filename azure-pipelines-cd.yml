
# DeployFlow CD pipeline (Milestone 7)
#
# Starts automatically when the CI pipeline's BuildPush stage succeeds on main.
# It NEVER builds anything: it deploys the exact image digest that CI built, scanned and pushed.
#
# Stage Staging:
#   deploy by digest -> smoke test -> deployment event -> promotion record
#
# Stage Production:
#   manual approval + branch check (on the "production" environment)
#   -> confirm the digest equals the one verified in staging
#   -> progressive release: candidate at 0% -> pre-traffic smoke test
#      -> 10% -> 50% -> 100%, with automatic rollback on any breach
#   -> final smoke test -> deployment event -> promotion record
#
# Every deployment is also recorded as an event in Application Insights (best effort).
# Never runs for pull requests.
#
# The "demo" parameters let you prove the safety features on purpose;
# leave them at their defaults for normal releases.

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: deployflow-ci
      trigger:
        branches:
          include:
            - main
        stages:
          - BuildPush

parameters:
  - name: smokeMaxP95Ms
    displayName: Staging smoke test - maximum 95th percentile latency (ms)
    type: number
    default: 1500

  - name: preTrafficMaxP95Ms
    displayName: Production pre-traffic smoke test - maximum p95 latency (ms)
    type: number
    default: 1500

  - name: canaryMaxP95Ms
    displayName: Production canary - maximum p95 latency (ms)
    type: number
    default: 1500

  - name: canaryMaxErrorPercent
    displayName: Production canary - maximum error rate (percent)
    type: number
    default: 5

  - name: forceProductionRedeploy
    displayName: DEMO - redeploy to production even if this image is already live
    type: boolean
    default: false

  - name: injectFaultPercent
    displayName: DEMO ONLY - percent of requests to "/" the candidate fails on purpose
    type: number
    default: 0

pool:
  name: deployflow-laptop-pool

variables:
  - name: azureServiceConnection
    value: sc-azure-deployflow

  - name: stagingApp
    value: ca-deployflow-staging

  - name: stagingResourceGroup
    value: rg-deployflow-staging-eus2

  - name: stagingAppInsights
    value: appi-deployflow-staging-eus2

  - name: prodApp
    value: ca-deployflow-prod

  - name: prodResourceGroup
    value: rg-deployflow-prod-eus2

  - name: prodAppInsights
    value: appi-deployflow-prod-eus2

stages:

  # ---------------------------------------------------------------------------
  # Stage 1: staging (simple deployment, then smoke test)
  # ---------------------------------------------------------------------------

  - stage: Staging
    displayName: Deploy and verify in staging

    jobs:
      - deployment: DeployStaging
        displayName: Deploy to staging
        environment: staging

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - download: ci
                  artifact: release-evidence
                  displayName: Download release evidence from CI

                - task: AzureCLI@2
                  displayName: Deploy the CI image (by digest) to staging
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\deploy-containerapp.ps1
                    arguments: >
                      -AppName $(stagingApp)
                      -ResourceGroup $(stagingResourceGroup)
                      -EnvironmentName staging
                      -MetadataPath "$(Pipeline.Workspace)\ci\release-evidence\release-metadata.json"
                      -RevisionSuffix "b$(Build.BuildId)-a$(System.StageAttempt)"
                      -OutputPath "$(Build.ArtifactStagingDirectory)\promotion\promotion-staging.json"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - powershell: |
                    & "$(Build.SourcesDirectory)\scripts\smoke-test.ps1" -BaseUrl "$(appUrl)" -ExpectedSha "$(shortSha)" -ExpectedEnvironment "staging" -MaxP95Ms ${{ parameters.smokeMaxP95Ms }} -OutputPath "$(Build.ArtifactStagingDirectory)\promotion\smoke-staging.json"
                    if ($LASTEXITCODE -ne 0) { exit 1 }
                  workingDirectory: $(Build.SourcesDirectory)
                  displayName: Smoke test staging

                - task: AzureCLI@2
                  displayName: Record the deployment event in Application Insights
                  condition: and(always(), eq(variables['promotionReady'], 'true'))
                  continueOnError: true
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\send-deployment-event.ps1
                    arguments: >
                      -AppInsightsName $(stagingAppInsights)
                      -ResourceGroup $(stagingResourceGroup)
                      -RecordPath "$(Build.ArtifactStagingDirectory)\promotion\promotion-staging.json"
                      -EnvironmentName staging
                      -EventName Deployment
                      -JobStatus "$(Agent.JobStatus)"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - publish: $(Build.ArtifactStagingDirectory)/promotion
                  artifact: promotion-staging
                  condition: and(always(), eq(variables['promotionReady'], 'true'))
                  displayName: Publish staging promotion record

  # ---------------------------------------------------------------------------
  # Stage 2: production (approval, then progressive release with automatic rollback)
  # ---------------------------------------------------------------------------

  - stage: Production
    displayName: Promote to production (progressive)
    dependsOn: Staging
    condition: succeeded()

    jobs:
      - deployment: DeployProduction
        displayName: Progressive release to production
        environment: production

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - download: ci
                  artifact: release-evidence
                  displayName: Download release evidence from CI

                - download: current
                  artifact: promotion-staging
                  displayName: Download the staging promotion record

                - task: AzureCLI@2
                  displayName: Progressive release of the SAME digest (0% -> 10% -> 50% -> 100%)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\deploy-progressive.ps1
                    arguments: >
                      -AppName $(prodApp)
                      -ResourceGroup $(prodResourceGroup)
                      -EnvironmentName production
                      -MetadataPath "$(Pipeline.Workspace)\ci\release-evidence\release-metadata.json"
                      -RequiredRecordPath "$(Pipeline.Workspace)\promotion-staging\promotion-staging.json"
                      -RevisionSuffix "b$(Build.BuildId)-a$(System.StageAttempt)"
                      -OutputPath "$(Build.ArtifactStagingDirectory)\promotion\promotion-production.json"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                      -ExpectedEnvironment prod
                      -PreTrafficMaxP95Ms ${{ parameters.preTrafficMaxP95Ms }}
                      -CanaryMaxP95Ms ${{ parameters.canaryMaxP95Ms }}
                      -MaxErrorRatePercent ${{ parameters.canaryMaxErrorPercent }}
                      -InjectFaultPercent ${{ parameters.injectFaultPercent }}
                      -ForceRedeploy ${{ parameters.forceProductionRedeploy }}
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - powershell: |
                    & "$(Build.SourcesDirectory)\scripts\smoke-test.ps1" -BaseUrl "$(appUrl)" -ExpectedSha "$(shortSha)" -ExpectedEnvironment "prod" -MaxP95Ms 5000 -OutputPath "$(Build.ArtifactStagingDirectory)\promotion\smoke-production.json"
                    if ($LASTEXITCODE -ne 0) { exit 1 }
                  workingDirectory: $(Build.SourcesDirectory)
                  displayName: Final smoke test of production

                - task: AzureCLI@2
                  displayName: Record the deployment event in Application Insights
                  condition: and(always(), eq(variables['promotionReady'], 'true'))
                  continueOnError: true
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\send-deployment-event.ps1
                    arguments: >
                      -AppInsightsName $(prodAppInsights)
                      -ResourceGroup $(prodResourceGroup)
                      -RecordPath "$(Build.ArtifactStagingDirectory)\promotion\promotion-production.json"
                      -EnvironmentName production
                      -EventName Deployment
                      -JobStatus "$(Agent.JobStatus)"
                      -RunUrl "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                    failOnStandardError: false
                    workingDirectory: $(Build.SourcesDirectory)

                - publish: $(Build.ArtifactStagingDirectory)/promotion
                  artifact: promotion-production
                  condition: and(always(), eq(variables['promotionReady'], 'true'))
                  displayName: Publish production promotion record
